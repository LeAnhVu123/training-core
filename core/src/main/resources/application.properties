spring.application.name=core
port=8080

spring.datasource.url=jdbc:postgresql://localhost:1255/db_study
spring.datasource.username=admin
spring.datasource.password=admin

#spring.liquibase.url=jdbc:postgresql://localhost:1255/db_study
#spring.liquibase.user=admin
#spring.liquibase.password=admin
#spring.liquibase.contexts=admin

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.jdbc.time_zone=UTC


#logging.config=classpath:logback-local.xml
#logging.level.org.hibernate.type.descriptor.sql.BasicBinder=OFF

#rabbitmq
spring.rabbitmq.host=localhost
spring.rabbitmq.port=25679
spring.rabbitmq.username=admin
spring.rabbitmq.password=admin

spring.output.ansi.enabled=ALWAYS
logging.config=classpath:logback-spring.xml

# HikariCP Connection Pool
spring.datasource.type=com.zaxxer.hikari.HikariDataSource

# Pool Configuration
spring.datasource.hikari.pool-name=CoreHikariPool
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000

# Connection Test
spring.datasource.hikari.connection-test-query=SELECT 1

# Leak Detection
spring.datasource.hikari.leak-detection-threshold=60000

#Property	Giá tr?	Ý ngh?a
#minimum-idle	5	S? connection t?i thi?u
#maximum-pool-size	10	S? connection t?i ?a
#idle-timeout	300000	?óng connection idle sau 5 phút
#max-lifetime	1800000	Tu?i th? connection 30 phút
#connection-timeout	30000	Ch? connection t?i ?a 30 giây
#validation-timeout	5000	Timeout ki?m tra connection
#leak-detection-threshold	60000	C?nh báo connection gi? quá 60 giây